name: sesenta
board: boards/myir
cores:
- fpga/cores/axi_ctl_register_v1_0
- fpga/cores/axis_variable_v1_0
- fpga/cores/axis_tlast_v1_0
- fpga/cores/axi_sts_register_v1_0
- fpga/cores/addr_counter_v1_0
memory:
- name: control
  range: 4K
  offset: '0x40000000'
- name: status
  range: 4K
  offset: '0x50000000'
- name: mic0
  range: 16K
  offset: '0x40040000'
- name: mic1
  range: 16K
  offset: '0x40044000'
- name: mic2
  range: 16K
  offset: '0x40048000'
- name: mic3
  range: 16K
  offset: '0x4004C000'
- name: mic4
  range: 16K
  offset: '0x40050000'
- name: mic5
  range: 16K
  offset: '0x40054000'
- name: mic6
  range: 16K
  offset: '0x40058000'
- name: mic7
  range: 16K
  offset: '0x4005C000'

control_registers:
- led_select
- start_capture

status_registers:
- done_capture

parameters:
  fclk0: 100000000
  
xdc:
- boards/myir/config/ports.xdc

drivers:
- server/drivers/common.hpp
- ./sesenta.hpp

