control_registers:
  - rst_regs
  - dma_gate
  - dma_gate1
  - n_samples
  - mic_select

status_registers:
  - mode

parameters:
  fclk0: 125000000 # FPGA clock speed in Hz

xdc:
  - boards/myir/config/ports.xdc

drivers:
  - server/drivers/common.hpp
  - server/drivers/dma-s2mm.hpp
  - ./sesenta.hpp

